name: Windows release checks
on:
  push:
    branches: [main, 'codex/**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.3.10'
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: '1.99.1'
      - run: bun install --frozen-lockfile
      - name: Source, policy, and credential checks
        run: |
          python scripts/check-project.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/check-release.py
      - name: Build installers
        run: bun run tauri build --ci
      - name: Regression tests (no model or account access)
        run: powershell -ExecutionPolicy Bypass -File scripts/test-codex.ps1
      - name: Built executable credential scan
        run: python scripts/check-release.py --artifact src-tauri/target/release/floatingbar.exe
      - name: Hook helper safe fallback
        run: python scripts/test-hook-helper.py
      - name: Package hashes
        run: python scripts/release-manifest.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: FloatingBar-windows-${{ github.sha }}
          path: src-tauri/target/release/release-assets/
          if-no-files-found: error
          retention-days: 14
